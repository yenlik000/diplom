server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirect bare root to the app
    location = / {
        return 302 /diplom/;
    }

    # SPA — /diplom/* files served directly; anything else falls back to index.html
    location /diplom {
        try_files $uri $uri/ /diplom/index.html;
    }

    # Allow up to 512 MB uploads (matches PHP upload_max_filesize)
    client_max_body_size 512M;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    # Proxy /api/* → PHP backend
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy /uploads/* → static files served by Apache in the backend container
    location /uploads/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_cache_valid  200 7d;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # Proxy /media/* → MinIO S3 storage (videos, audio)
    location /media/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_upstream http://minio:9000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass         $minio_upstream;
        proxy_set_header   Host              minio:9000;
        proxy_cache_valid  200 1d;
        expires            1d;
        add_header         Cache-Control "public";
        proxy_buffering    off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
